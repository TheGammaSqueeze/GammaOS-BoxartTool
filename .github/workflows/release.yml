name: Build and release binaries

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            asset: gammaos-boxart-linux-x86_64
            bin: gammaos-boxart
          - os: windows-latest
            asset: gammaos-boxart-windows-x86_64.exe
            bin: gammaos-boxart.exe
          - os: macos-13
            asset: gammaos-boxart-macos-x86_64
            bin: gammaos-boxart
          - os: macos-14
            asset: gammaos-boxart-macos-arm64
            bin: gammaos-boxart
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip pyinstaller pillow
          python -m pip install .

      - name: Bake in built-in ScreenScraper credentials
        shell: bash
        env:
          SS_DEVCREDS_GEN: ${{ secrets.SS_DEVCREDS_GEN }}
        run: |
          if [ -n "$SS_DEVCREDS_GEN" ]; then
            python -c "import base64,os; open('gammaos_boxart/_devcreds_gen.py','wb').write(base64.b64decode(os.environ['SS_DEVCREDS_GEN']))"
            echo "baked built-in ScreenScraper credentials into the build"
          else
            echo "no SS_DEVCREDS_GEN secret; building without built-in credentials (users supply their own)"
          fi

      - name: Build one-file binary
        run: >
          pyinstaller --onefile --name gammaos-boxart --clean --noconfirm
          --paths .
          --hidden-import tkinter
          --hidden-import PIL --hidden-import PIL.ImageTk --hidden-import PIL._tkinter_finder
          --collect-submodules gammaos_boxart
          packaging/entry.py

      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p out
          cp "dist/${{ matrix.bin }}" "out/${{ matrix.asset }}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.asset }}
          path: out/${{ matrix.asset }}

      - name: Ensure release exists
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        # Create the release from the tag if it does not exist yet, so a bare
        # `git push origin vX.Y.Z` works without a separate `gh release create`.
        # The `|| true` swallows the race where a sibling matrix job creates it
        # in the same instant.
        run: |
          gh release view "${GITHUB_REF_NAME}" \
            || gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --generate-notes \
            || true

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" "out/${{ matrix.asset }}" --clobber
